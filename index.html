<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFROKÓDICA | KERNEL V3.0 UNIFICADO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --kernel-gold: #d4af37;
      --kernel-void: #050505;
      --kernel-alert: #ff3e3e;
      --kernel-safe: #00ff41;
      --glow-gold: rgba(212,175,55,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--kernel-void);
      color: var(--kernel-gold);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      cursor: crosshair;
      overflow: hidden;
    }
    .crt::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.2) 50%),
        linear-gradient(90deg, rgba(255,0,0,.03), rgba(0,255,0,.02), rgba(0,0,255,.03));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 40;
    }
    .crt::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(18,16,16,.08);
      animation: flicker .15s infinite;
      pointer-events: none;
      z-index: 41;
    }
    @keyframes flicker {
      0% { opacity: .08; }
      50% { opacity: .03; }
      100% { opacity: .08; }
    }
    .terminal {
      border: 1px solid rgba(212,175,55,.35);
      background: rgba(212,175,55,.04);
      box-shadow: inset 0 0 20px rgba(212,175,55,.05);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--kernel-gold); }
  </style>
</head>
<body class="crt relative h-screen p-3">

<header class="flex justify-between items-start border-b border-yellow-800/40 pb-2">
  <div>
    <span class="bg-yellow-600 text-black px-2 py-0.5 text-xs font-black">SOBERANIA ATIVA</span>
    <div class="text-[9px] opacity-50 mt-1">CORE_V3.0 • KERNEL UNIFICADO</div>
  </div>
  <div class="text-right">
    <div class="text-[9px] text-red-500 font-bold">OFF-GRID</div>
    <div id="clock" class="text-lg font-black text-white">00:00:00</div>
  </div>
</header>

<main class="grid grid-cols-12 gap-3 mt-3 h-[calc(100%-110px)]">
  <section class="col-span-12 terminal p-4 flex flex-col">
    <div class="text-center">
      <h1 class="text-3xl font-black tracking-[0.4em]">AFROKÓDICA</h1>
      <p class="text-[9px] tracking-[0.6em] opacity-40 mt-2">KERNEL SOBERANO COM MEMÓRIA REAL</p>
    </div>
    <div class="border-t border-b border-yellow-700/30 my-4 py-2">
      <div id="log" class="h-48 overflow-y-auto text-left text-[10px] space-y-1"></div>
    </div>
  </section>
</main>

<footer class="mt-3">
  <div class="terminal p-2 flex items-center gap-2">
    <span class="text-yellow-500 font-bold text-xs">DALA@AFROKODICA ~#</span>
    <input id="cmd" class="bg-transparent outline-none text-white text-xs w-full" placeholder="INTRODUZA COMANDO" />
  </div>
</footer>

<script>
/* ============================
   KERNEL UNIFICADO V3.0
   UI + ESTADO + MEMÓRIA REAL
   ============================ */

const MEMORY_KEY = 'AFROKODICA_KERNEL_MEMORY_V3';

const UI = {
  clock: document.getElementById('clock'),
  logEl: document.getElementById('log'),
  cmd: document.getElementById('cmd'),

  log(msg, level = 'INFO') {
    const line = document.createElement('div');
    const time = new Date().toLocaleTimeString('pt-PT', { hour12: false });
    const colors = { INFO:'text-white', SYS:'text-yellow-500', OK:'text-green-400', WARN:'text-red-400' };
    line.className = colors[level] || 'text-white';
    line.textContent = `[${time}] [${level}] ${msg}`;
    this.logEl.appendChild(line);
    this.logEl.scrollTop = this.logEl.scrollHeight;
  },

  tick() {
    this.clock.textContent = new Date().toLocaleTimeString('pt-PT', { hour12:false });
  }
};

const Kernel = {
  state: {
    bootCount: 0,
    lastBoot: null,
    mode: 'observação',
    coerencia: 1.0
  },

  load() {
    try {
      const raw = localStorage.getItem(MEMORY_KEY);
      if (raw) this.state = JSON.parse(raw);
    } catch(e) {}
  },

  save() {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(this.state));
  },

  identityRule() {
    const b = this.state.bootCount;
    if (b < 3) return 'observação';
    if (b < 7) return 'aprendizagem';
    if (b < 15) return 'interação';
    return 'soberania';
  },

  boot() {
    this.load();
    this.state.bootCount += 1;
    this.state.lastBoot = new Date().toISOString();
    this.state.mode = this.identityRule();
    UI.log(`BOOT #${this.state.bootCount} | MODO=${this.state.mode}`, 'SYS');
    this.save();
  },

  comandos: {
    STATUS() {
      UI.log(`BOOT=${Kernel.state.bootCount} | MODO=${Kernel.state.mode} | COERÊNCIA=${Kernel.state.coerencia}`, 'OK');
    },
    IDENTIDADE() {
      UI.log(`IDENTIDADE ATUAL: ${Kernel.state.mode}`, 'OK');
    },
    EVOLUIR() {
      Kernel.state.coerencia = Math.min(1, Kernel.state.coerencia + 0.05);
      UI.log('COERÊNCIA AUMENTADA', 'SYS');
      Kernel.save();
    },
    MEMORIA() {
      UI.log('MEMÓRIA LOCAL ATIVA E PERSISTENTE', 'OK');
    }
  },

  exec(cmd) {
    if (this.comandos[cmd]) this.comandos[cmd]();
    else UI.log(`COMANDO "${cmd}" NÃO RECONHECIDO`, 'WARN');
  }
};

setInterval(() => UI.tick(), 1000);
Kernel.boot();

UI.cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const c = UI.cmd.value.trim().toUpperCase();
    if (!c) return;
    UI.log(`CMD > ${c}`, 'SYS');
    Kernel.exec(c);
    UI.cmd.value = '';
  }
});
</script>
</body>
</html>

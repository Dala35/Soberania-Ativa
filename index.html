<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFROKÓDICA | KERNEL V4.0 – MEMÓRIA AUDITÁVEL</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --kernel-gold: #d4af37;
      --kernel-void: #050505;
      --kernel-alert: #ff3e3e;
      --kernel-safe: #00ff41;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--kernel-void);
      color: var(--kernel-gold);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      cursor: crosshair;
      overflow: hidden;
    }
    .terminal {
      border: 1px solid rgba(212,175,55,.35);
      background: rgba(212,175,55,.04);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--kernel-gold); }
  </style>
</head>
<body class="relative h-screen p-3">

<header class="flex justify-between items-start border-b border-yellow-800/40 pb-2">
  <div>
    <span class="bg-yellow-600 text-black px-2 py-0.5 text-xs font-black">KERNEL V4.0</span>
    <div class="text-[9px] opacity-50 mt-1">MEMÓRIA • IDENTIDADE • AUDITORIA</div>
  </div>
  <div class="text-right">
    <div id="clock" class="text-lg font-black text-white">00:00:00</div>
  </div>
</header>

<main class="grid grid-cols-12 gap-3 mt-3 h-[calc(100%-110px)]">
  <section class="col-span-7 terminal p-3 flex flex-col">
    <div class="text-center mb-2">
      <h1 class="text-2xl font-black tracking-[0.3em]">AFROKÓDICA</h1>
      <p class="text-[9px] opacity-40">TIMELINE DE MEMÓRIA</p>
    </div>
    <div id="log" class="flex-1 overflow-y-auto text-[10px] space-y-1"></div>
  </section>

  <section class="col-span-5 terminal p-3">
    <h2 class="text-xs font-bold mb-2">ESTADO ATUAL</h2>
    <pre id="stateView" class="text-[9px] text-white whitespace-pre-wrap"></pre>
  </section>
</main>

<footer class="mt-3">
  <div class="terminal p-2 flex items-center gap-2">
    <span class="text-yellow-500 font-bold text-xs">DALA@AFROKODICA ~#</span>
    <input id="cmd" class="bg-transparent outline-none text-white text-xs w-full" placeholder="COMANDO" />
  </div>
</footer>

<script>
/* ============================
   KERNEL SOBERANO V4.0
   MEMÓRIA AUDITÁVEL
   ============================ */

const MEMORY_KEY = 'AFROKODICA_KERNEL_V4';

const UI = {
  clock: document.getElementById('clock'),
  logEl: document.getElementById('log'),
  stateView: document.getElementById('stateView'),
  cmd: document.getElementById('cmd'),

  log(msg, type = 'INFO') {
    const t = new Date().toLocaleTimeString('pt-PT', { hour12:false });
    const div = document.createElement('div');
    div.textContent = `[${t}] ${msg}`;
    this.logEl.appendChild(div);
    this.logEl.scrollTop = this.logEl.scrollHeight;
  },

  renderState(state) {
    this.stateView.textContent = JSON.stringify(state, null, 2);
  },

  tick() {
    this.clock.textContent = new Date().toLocaleTimeString('pt-PT', { hour12:false });
  }
};

const Kernel = {
  state: {
    id: crypto.randomUUID(),
    bootCount: 0,
    mode: 'observação',
    coerencia: 1.0,
    timeline: []
  },

  load() {
    const raw = localStorage.getItem(MEMORY_KEY);
    if (raw) this.state = JSON.parse(raw);
  },

  save() {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(this.state));
    UI.renderState(this.state);
  },

  evolveIdentity() {
    const b = this.state.bootCount;
    if (b < 3) return 'observação';
    if (b < 7) return 'aprendizagem';
    if (b < 15) return 'interação';
    return 'soberania';
  },

  record(event) {
    this.state.timeline.push({
      time: new Date().toISOString(),
      event
    });
  },

  boot() {
    this.load();
    this.state.bootCount++;
    this.state.mode = this.evolveIdentity();
    this.record(`BOOT #${this.state.bootCount} | MODO=${this.state.mode}`);
    UI.log(`BOOT REAL EXECUTADO`);
    this.save();
  },

  comandos: {
    STATUS() {
      UI.log(`BOOT=${Kernel.state.bootCount} | MODO=${Kernel.state.mode}`);
    },
    IDENTIDADE() {
      UI.log(`IDENTIDADE: ${Kernel.state.mode}`);
    },
    TIMELINE() {
      Kernel.state.timeline.forEach(e => UI.log(`${e.time} → ${e.event}`));
    },
    EXPORTAR() {
      const blob = new Blob([JSON.stringify(Kernel.state, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'afrokodica_memoria.json';
      a.click();
    },
    RESETAR() {
      UI.log('RESET BLOQUEADO (SEGURANÇA)', 'WARN');
    }
  },

  exec(cmd) {
    if (this.comandos[cmd]) this.comandos[cmd]();
    else UI.log(`COMANDO DESCONHECIDO: ${cmd}`);
  }
};

setInterval(() => UI.tick(), 1000);
Kernel.boot();

UI.cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const c = UI.cmd.value.trim().toUpperCase();
    if (!c) return;
    UI.log(`CMD > ${c}`);
    Kernel.exec(c);
    UI.cmd.value = '';
  }
});
</script>
</body>
</html>
